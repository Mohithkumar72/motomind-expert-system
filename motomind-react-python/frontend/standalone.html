    .arch-card { background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 1rem; }
    .arch-badge { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--primary-orange); color: #fff; font-size: 0.75rem; font-weight: 800; text-align: center; line-height: 22px; margin-bottom: 0.5rem; }
    .code-snippet { background: var(--bg-darkest); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0.75rem 1rem; font-family: var(--font-mono); font-size: 0.82rem; color: var(--primary-orange); margin-top: 0.5rem; }
    .tech-pill-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .tech-pill { background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); font-size: 0.78rem; font-weight: 600; color: #e2e8f0; padding: 0.35rem 0.75rem; border-radius: 9999px; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border-subtle); display: flex; justify-content: flex-end; }
    .app-footer { background: var(--bg-darker); border-top: 1px solid var(--border-subtle); padding: 1.5rem; margin-top: auto; }
    .footer-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; font-size: 0.84rem; color: var(--text-dim); }
    @media print { .app-header, .app-footer, .results-action-bar, .modal-wrapper, .modal-backdrop { display: none !important; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const SYMPTOM_DATA = [
      {
        id: "starting",
        name: "Starting Problems",
        icon: "zap",
        symptoms: [
          { id: "bike_wont_start", label: "Bike won't start", desc: "Engine does not crank or refuses to fire up at all." },
          { id: "self_start_not_working", label: "Self-start not working", desc: "Pressing electric starter button produces no starter motor rotation." },
          { id: "clicking_sound_starting", label: "Clicking sound when starting", desc: "A rapid clicking noise is heard from under the seat when pressing start." }
        ]
      },
      {
        id: "engine",
        name: "Engine Problems",
        icon: "engine",
        symptoms: [
          { id: "engine_overheating", label: "Engine overheating", desc: "Engine block becomes abnormally hot, emits burning odor or high temp warning." },
          { id: "engine_unusual_noises", label: "Engine making unusual noises", desc: "Metallic knocking, tapping, rattling, or grinding sounds while running." },
          { id: "engine_stopping_frequently", label: "Engine stopping frequently", desc: "Engine stalls suddenly at idling, traffic signals, or when slowing down." }
        ]
      },
      {
        id: "performance",
        name: "Performance Problems",
        icon: "gauge",
        symptoms: [
          { id: "low_mileage", label: "Low mileage", desc: "Fuel tank drains much faster than normal; unexpected drop in fuel economy." },
          { id: "poor_acceleration", label: "Poor acceleration", desc: "Bike feels sluggish, struggles to pick up speed despite twisting throttle." },
          { id: "excessive_vibration", label: "Excessive vibration", desc: "Intense vibrations felt on handlebars, footpegs, or seat at specific speeds." }
        ]
      },
      {
        id: "electrical",
        name: "Electrical Problems",
        icon: "battery",
        symptoms: [
          { id: "headlight_not_working", label: "Headlight not working", desc: "Headlamp does not turn on, flickers heavily, or glows extremely dim." },
          { id: "battery_draining_quickly", label: "Battery draining quickly", desc: "Battery loses charge within hours or overnight without use." },
          { id: "horn_not_working", label: "Horn not working", desc: "Horn produces no sound, a weak squeak, or only works when revving." }
        ]
      }
    ];

    function StandaloneMotoMindApp() {
      const [activeView, setActiveView] = useState('home');
      const [aboutOpen, setAboutOpen] = useState(false);
      const [selectedSymptoms, setSelectedSymptoms] = useState(new Set());
      const [searchQuery, setSearchQuery] = useState('');
      const [backendOnline, setBackendOnline] = useState(false);
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);

      // Probe Python backend
      useEffect(() => {
        fetch("http://127.0.0.1:5000/api/health")
          .then(res => res.ok ? setBackendOnline(true) : setBackendOnline(false))
          .catch(() => setBackendOnline(false));
      }, []);

      const toggleSymptom = (id) => {
        setSelectedSymptoms(prev => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      };

      const loadPreset = (type) => {
        const presets = {
          battery: ["bike_wont_start", "clicking_sound_starting", "headlight_not_working"],
          overheating: ["engine_overheating", "engine_unusual_noises", "poor_acceleration"],
          carb: ["low_mileage", "poor_acceleration", "engine_stopping_frequently"],
          elec: ["headlight_not_working", "horn_not_working", "self_start_not_working"]
        };
        setSelectedSymptoms(new Set(presets[type] || []));
      };

      const runDiagnosis = async () => {
        if (selectedSymptoms.size === 0) return alert("Select at least one symptom!");
        setLoading(true);
        try {
          const res = await fetch("http://127.0.0.1:5000/api/diagnose", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ symptoms: Array.from(selectedSymptoms) })
          });
          const data = await res.json();
          setResults(data.results || []);
          setBackendOnline(true);
          setActiveView('results');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          alert("Could not reach Python API at http://127.0.0.1:5000. Please start python app.py!");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div>
          <header className="app-header">
            <div className="header-container">
              <div className="brand-logo" onClick={() => setActiveView('home')}>
                <div className="logo-icon-box">
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2">
                    <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/>
                    <path d="M15 6h-3a1 1 0 0 0-1 1v4l-3 3h5.5l1.5-3.5L18 12"/><path d="M9 17h6"/><circle cx="12" cy="7" r="1" fill="currentColor"/>
                  </svg>
                </div>
                <div>
                  <div className="brand-name">Moto<span className="brand-highlight">Mind</span></div>
                  <div className="brand-tagline">React + Python AI Expert System</div>
                </div>
              </div>

              <div className="nav-links">
                <span className={`status-pill ${backendOnline ? 'online' : 'offline'}`}>
                  <span className="status-dot"></span>
                  {backendOnline ? 'Python API Online' : 'Python API Offline'}
                </span>
                <button className="nav-link-btn" onClick={() => setActiveView('diagnosis')}>Diagnose</button>
                <button className="nav-link-btn" onClick={() => setAboutOpen(true)}>About AI System</button>
              </div>
            </div>
          </header>

          <main className="main-content">
            {activeView === 'home' && (
              <div className="hero-container">
                <div className="hero-badge"><span className="pulse-dot"></span> Python Rule-Based AI Engine</div>
                <h1 className="hero-title">Smart Diagnostics for <br/><span className="text-gradient">Two-Wheeler Faults</span></h1>
                <p className="hero-description">MotoMind connects a responsive <strong>React.js</strong> interface to a <strong>Python</strong> forward-chaining expert system for transparent mechanical reasoning.</p>
                <div className="hero-actions">
                  <button className="btn btn-primary btn-lg" onClick={() => setActiveView('diagnosis')}>Start Diagnosis</button>
                  <button className="btn btn-secondary btn-lg" onClick={() => setAboutOpen(true)}>How MotoMind Works</button>
                </div>
                <div className="features-grid">
                  <div className="feature-card">
                    <div className="feature-icon orange"><strong>PY</strong></div>
                    <div className="feature-title">Python Knowledge Base</div>
                    <div className="feature-desc">12 production IF-THEN rules encoded in Python rules.py.</div>
                  </div>
                  <div className="feature-card">
                    <div className="feature-icon amber"><strong>AI</strong></div>
                    <div className="feature-title">Inference Engine</div>
                    <div className="feature-desc">Calculates deterministic match scores using forward chaining.</div>
                  </div>
                  <div className="feature-card">
                    <div className="feature-icon emerald"><strong>UI</strong></div>
                    <div className="feature-title">React.js Dashboard</div>
                    <div className="feature-desc">Dynamic cards, search filters, and print-ready reports.</div>
                  </div>
                </div>
              </div>
            )}

            {activeView === 'diagnosis' && (
              <div className="diagnosis-wrapper">
                <div className="section-nav-bar">
                  <button className="btn btn-ghost btn-sm" onClick={() => setActiveView('home')}>← Back to Home</button>
                  <div className="wizard-step-indicator">
                    <span className="step-badge">Step 1 of 2</span>
                    <span className="step-title">Select Observed Symptoms</span>
                  </div>
                </div>

                <h2 className="section-title">What issues are you experiencing?</h2>
                <p className="section-subtitle">Select observed symptoms to trigger the Python rule evaluation.</p>

                <div className="preset-box">
                  <span className="preset-label">⚡ Live Presets:</span>
                  <div className="preset-buttons-group">
                    <button className="btn-preset" onClick={() => loadPreset('battery')}>Dead Battery</button>
                    <button className="btn-preset" onClick={() => loadPreset('overheating')}>Overheating</button>
                    <button className="btn-preset" onClick={() => loadPreset('carb')}>Carb Clog</button>
                    <button className="btn-preset" onClick={() => loadPreset('elec')}>Electrical Short</button>
                  </div>
                </div>

                <div className="symptom-toolbar">
                  <div className="search-box-wrapper">
                    <input 
                      type="text" 
                      placeholder="Search symptoms..." 
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                    />
                  </div>
                  <div className="toolbar-actions">
                    <button className="btn btn-outline btn-sm" onClick={() => {
                      const s = new Set();
                      SYMPTOM_DATA.forEach(c => c.symptoms.forEach(sym => s.add(sym.id)));
                      setSelectedSymptoms(s);
                    }}>Select All</button>
                    <button className="btn btn-outline btn-sm" onClick={() => setSelectedSymptoms(new Set())}>Clear</button>
                    <span className={`count-badge ${selectedSymptoms.size > 0 ? 'has-selection' : ''}`}>
                      {selectedSymptoms.size} Selected
                    </span>
                  </div>
                </div>

                <div className="categories-container">
                  {SYMPTOM_DATA.map(cat => {
                    const filtered = cat.symptoms.filter(s => 
                      !searchQuery || s.label.toLowerCase().includes(searchQuery.toLowerCase()) || s.desc.toLowerCase().includes(searchQuery.toLowerCase())
                    );
                    if (filtered.length === 0) return null;
                    return (
                      <div key={cat.id} className="category-group-card">
                        <div className="category-header">
                          <h3 className="category-title">{cat.name}</h3>
                          <span className="category-meta">{filtered.length} symptoms</span>
                        </div>
                        <div className="symptoms-grid">
                          {filtered.map(s => {
                            const isChecked = selectedSymptoms.has(s.id);
                            return (
                              <label 
                                key={s.id} 
                                className={`symptom-checkbox-label ${isChecked ? 'active' : ''}`}
                                onClick={() => toggleSymptom(s.id)}
                              >
                                <div className="checkbox-custom-wrapper">
                                  <input type="checkbox" className="symptom-checkbox" checked={isChecked} onChange={() => {}} />
                                  <span className="custom-checkbox-indicator">✓</span>
                                </div>
                                <div>
                                  <div className="symptom-name">{s.label}</div>
                                  <div className="symptom-desc">{s.desc}</div>
                                </div>
                              </label>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="diagnosis-footer-bar">
                  <span className="footer-tip">Ready to analyze with Python backend</span>
                  <button 
                    className="btn btn-primary btn-lg" 
                    onClick={runDiagnosis}
                    disabled={selectedSymptoms.size === 0 || loading}
                  >
                    {loading ? "Running Python Inference..." : "Diagnose Faults"}
                  </button>
                </div>
              </div>
            )}

            {activeView === 'results' && (
              <div className="results-wrapper">
                <div className="results-action-bar">
                  <button className="btn btn-ghost btn-sm" onClick={() => setActiveView('diagnosis')}>← Modify Symptoms</button>
                  <div style={{ display: 'flex', gap: '0.5rem' }}>
                    <button className="btn btn-secondary btn-sm" onClick={() => window.print()}>Print / Save</button>
                    <button className="btn btn-outline btn-sm" onClick={() => { setSelectedSymptoms(new Set()); setActiveView('diagnosis'); }}>Reset</button>
                  </div>
                </div>

                <div className="diagnosis-overview-card">
                  <div>
                    <div className="overview-label">Symptoms Input</div>
                    <div className="overview-value">{selectedSymptoms.size} Selected</div>
                  </div>
                  <div className="overview-divider"></div>
                  <div>
                    <div className="overview-label">Python AI Status</div>
                    <div className="overview-value text-accent">{results.length} Faults Diagnosed</div>
                  </div>
                  <div className="overview-divider"></div>
                  <div>
                    <div className="overview-label">Inference Engine</div>
                    <div className="overview-value">Forward-Chaining Match</div>
                  </div>
                </div>

                <div className="results-cards-grid">
                  {results.map((r, i) => (
                    <article key={r.rule_id} className={`diagnosis-result-card severity-${r.severity.toLowerCase()}`}>
                      <div className="card-top-bar">
                        <span className="rank-badge">#{i+1} Likely Cause</span>
                        <div style={{ display: 'flex', gap: '0.5rem' }}>
                          <span className={`severity-badge badge-severity-${r.severity.toLowerCase()}`}>{r.severity} Severity</span>
                          <span className="match-score-badge match-high">{r.match_percentage}% Match</span>
                        </div>
                      </div>
                      <h3 className="card-fault-title">{r.fault}</h3>

                      <div className="match-meter-wrapper">
                        <div className="match-meter-bar">
                          <div className="match-meter-fill match-high" style={{ width: `${r.match_percentage}%` }}></div>
                        </div>
                        <span className="match-meter-text">{r.match_count} of {r.total_symptoms} key symptoms matched</span>
                      </div>

                      <div className="rule-trigger-banner">
                        <div className="rule-tag-header">Triggered Rule ({r.rule_id})</div>
                        <code className="rule-code">{r.rule_condition}</code>
                      </div>

                      <div className="section-subheading">Why MotoMind Suggested This:</div>
                      <p className="explanation-text">{r.explanation}</p>

                      <div className="section-subheading">Basic Troubleshooting:</div>
                      <ul className="steps-list">
                        {r.troubleshooting.map((step, idx) => (
                          <li key={idx} className="step-item">
                            <span className="step-num">{idx + 1}</span>
                            <span className="step-text">{step}</span>
                          </li>
                        ))}
                      </ul>

                      <div className="mechanic-advice-box">
                        <div className="advice-content"><strong>Professional Guidance:</strong> {r.mechanic_advice}</div>
                      </div>
                    </article>
                  ))}
                </div>
              </div>
            )}
          </main>

          {aboutOpen && (
            <div className="modal-wrapper active">
              <div className="modal-card">
                <div className="modal-header">
                  <h3>About MotoMind AI System</h3>
                  <button className="modal-close" onClick={() => setAboutOpen(false)}>×</button>
                </div>
                <div className="modal-body">
                  <p>MotoMind uses a <strong>Rule-Based Expert System</strong> architecture written in Python with a React frontend.</p>
                  <div className="code-snippet">Match % = (Matched Rule Symptoms / Total Rule Symptoms) * 100%</div>
                </div>
                <div className="modal-footer">
                  <button className="btn btn-secondary" onClick={() => setAboutOpen(false)}>Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StandaloneMotoMindApp />);
  </script>
</body>
</html>
